server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Never cache the app shell, service worker or manifest
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
  }

  # Hashed build assets and icons are immutable
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /icons/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Same-origin Discogs proxy. The app talks to /discogs/* (no CORS preflight,
  # no cross-origin rate-limit surprise) and nginx forwards to upstream.
  location /discogs/ {
    proxy_pass https://api.discogs.com/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}